[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "salttiger-library"
version = "0.1.0"
description = "A personal SaltTiger metadata index and OneDrive library synchronizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
st = "salttiger_library.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/salttiger_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
